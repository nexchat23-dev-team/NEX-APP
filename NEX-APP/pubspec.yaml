name: nex_app
description: A Flutter version of NEXCHAT.
version: 1.0.0+1
publish_to: 'none'
environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  # Firebase packages removed per repository cleanup request
  provider: ^6.0.8
  permission_handler: ^11.3.0
  shared_preferences: ^2.4.26
  google_sign_in: ^6.1.5
  nearby_connections: ^4.3.0
  file_picker: ^6.0.0
  local_auth: ^2.1.4
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.0.17
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^3.0.6
  path: ^1.8.3
  connectivity_plus: ^4.0.1
  workmanager: ^0.9.0+3
  flutter_webrtc: ^1.5.0
  flutter_sound: ^9.30.0
  supabase_flutter: ^2.15.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_core: ^3.0.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#22223A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#22223A"
    theme_color: "#22223A"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
